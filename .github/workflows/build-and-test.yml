name: build-and-test
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  check-dist:
    name: "check-dist matches source"
    uses: cloudposse/.github/.github/workflows/shared-ci-typescript-app-check-dist.yml@main
    with:
      node-version: 20.x

  unit-test:
    name: "unit tests"
    runs-on: ubuntu-latest
    needs: check-dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: yarn
      - name: install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - uses: cloudposse/github-action-setup-atmos@60878d48037763f759aedee74e9cc0c2dc88e9ec # v3.5.0
        with:
          install-wrapper: false
      - name: run unit tests
        run: yarn test

  integration-test-single:
    name: "integration test: single setting"
    runs-on: ubuntu-latest
    needs: check-dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: yarn
      - uses: cloudposse/github-action-setup-atmos@60878d48037763f759aedee74e9cc0c2dc88e9ec # v3.5.0
        with:
          install-wrapper: false
      - uses: ./
        id: get-setting
        with:
          component: foo
          stack: core-ue1-dev
          settings-path: atmos_cli_config.components.terraform.base_path
      - uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          expected: "components/terraform"
          actual: ${{ steps.get-setting.outputs.value}}

  integration-test-multiple:
    name: "integration test: multiple settings"
    runs-on: ubuntu-latest
    needs: check-dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: yarn
      - uses: cloudposse/github-action-setup-atmos@60878d48037763f759aedee74e9cc0c2dc88e9ec # v3.5.0
        with:
          install-wrapper: false
      - uses: ./
        id: get-setting
        with:
          settings: |
            - component: foo
              stack: core-ue1-dev
              settingsPath: atmos_cli_config.components.terraform.base_path
              outputPath: prop1
            - component: foo
              stack: core-ue1-dev
              settingsPath: settings.level1.level2.level3.secrets-arn
              outputPath: prop2

      - uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          expected: '{"prop1":"components/terraform","prop2":"arn:aws:secretsmanager:us-east-1:000000000000:secret:MySecret-PlMes3"}'
          actual: ${{ steps.get-setting.outputs.settings}}
